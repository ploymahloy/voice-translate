name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            client:
              - 'client/**'
              - '.github/workflows/ci.yml'

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'server/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest pyright

      - name: Unit tests
        run: PYTHONPATH=. pytest -c server/pytest.ini -v -m "not integration"

      - name: Typecheck
        run: PYTHONPATH=. pyright server

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Astro check
        working-directory: client
        run: npm run check

      - name: Vitest
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

  deploy:
    needs: [changes, server, client]
    if: |
      always() &&
      github.event_name == 'push' &&
      (needs.server.result == 'success' || needs.server.result == 'skipped') &&
      (needs.client.result == 'success' || needs.client.result == 'skipped') &&
      (needs.changes.outputs.server == 'true' || needs.changes.outputs.client == 'true')
    runs-on: self-hosted
    steps:
      - name: Pull latest changes on EC2
        run: |
          cd /var/www/server
          git checkout master
          git pull origin master

      - name: Deploy backend
        if: needs.changes.outputs.server == 'true'
        run: |
          cd /var/www/server
          test -d .venv || python3 -m venv .venv
          .venv/bin/pip install -r server/requirements.txt
          sudo cp server/fastapi_app.service /etc/systemd/system/fastapi_app.service
          sudo systemctl daemon-reload
          make -C server deploy

      - name: Deploy frontend
        if: needs.changes.outputs.client == 'true'
        run: |
          cd client
          npm ci
          npm run build
