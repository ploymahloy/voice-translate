name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server-changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'

  client-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - '.github/workflows/ci.yml'

  server:
    needs: server-changes
    if: needs.server-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'server/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest pyright

      - name: Unit tests
        run: PYTHONPATH=. pytest -c server/pytest.ini -v -m "not integration"

      - name: Typecheck
        run: PYTHONPATH=. pyright server

  client:
    needs: client-changes
    if: needs.client-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Astro check
        working-directory: client
        run: npm run check

      - name: Vitest
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

  deploy-backend:
    needs: [server-changes, server]
    if: |
      github.event_name == 'push' &&
      needs.server-changes.outputs.server == 'true' &&
      needs.server.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Sync backend to /var/www/server
        run: |
          SRC=/var/www/voice-translate-src
          mkdir -p "$SRC"
          if [ ! -d "$SRC/.git" ]; then
            git clone https://github.com/ploymahloy/voice-translate.git "$SRC"
          fi
          cd "$SRC"
          git config --global --add safe.directory "$SRC"
          git fetch origin
          git reset --hard origin/master
          rsync -rl --delete --exclude .venv --exclude .env server/ /var/www/server/
          rsync -rl --delete shared/ /var/www/server/shared/

      - name: Deploy backend
        run: |
          cd /var/www/server
          test -d .venv || python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          sudo cp fastapi_app.service /etc/systemd/system/fastapi_app.service
          sudo systemctl daemon-reload
          make deploy
