name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pipx and install deps
        run: |
          python -m pip install --upgrade pipx
          pipx install --python ${{ matrix.python-version }} pytest
          pipx inject pytest -r server/requirements.txt
          pipx install --python ${{ matrix.python-version }} pyright
          pipx inject pyright -r server/requirements.txt
          pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: PYTHONPATH=. pytest -c server/pytest.ini -v -m "not integration"

      - name: Typecheck
        run: PYTHONPATH=. pyright server

  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Astro check
        working-directory: client
        run: npm run check

      - name: Vitest
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build
