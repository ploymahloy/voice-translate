name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'server/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest pyright

      - name: Unit tests
        run: PYTHONPATH=. pytest -c server/pytest.ini -v -m "not integration"

      - name: Typecheck
        run: PYTHONPATH=. pyright server

  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Astro check
        working-directory: client
        run: npm run check

      - name: Vitest
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

  deploy:
    runs-on: self-hosted
    needs: [test, client]
    if: github.event_name == 'push'

    steps:
      - name: Pull latest changes on EC2
        run: |
          cd /var/www/server
          git pull origin master

      - name: Deploy Backend & Frontend
        run: |
          cd /var/www/server

          pip install -r server/requirements.txt

          cd client
          npm ci
          npm run build
          cd ..

          make run
